services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: khilafah-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: khilafah
      POSTGRES_PASSWORD: khilafah
      POSTGRES_DB: khilafah
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U khilafah -d khilafah"]
      interval: 5s
      timeout: 5s
      retries: 10

  neo4j:
    image: neo4j:5-community
    container_name: khilafah-neo4j
    restart: unless-stopped
    environment:
      NEO4J_AUTH: neo4j/change-me
      NEO4J_dbms_memory_pagecache_size: 256M
      NEO4J_dbms_memory_heap_max__size: 512M
    ports:
      - "7474:7474" # browser UI
      - "7687:7687" # bolt
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: khilafah-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://khilafah:khilafah@postgres:5432/khilafah
      NEO4J_URI: bolt://neo4j:7687
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - uploads_data:/app/data/uploads

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000/api
    container_name: khilafah-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:3000"

volumes:
  postgres_data:
  neo4j_data:
  uploads_data:
